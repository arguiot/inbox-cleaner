name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: actions/setup-node@54337e0d02de9202d0948aaff36ad556375497b9
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npx --no-install wrangler deploy --dry-run --outdir /tmp/inbox-cleaner-build
        env:
          WRANGLER_SEND_METRICS: 'false'
