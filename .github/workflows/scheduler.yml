name: Keep personal inbox cleaner running
on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: personal-inbox-cleaner-watchdog
  cancel-in-progress: false
jobs:
  check:
    if: github.ref == 'refs/heads/main' && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment: personal-cloudflare
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - name: Check durable scheduler
        run: node scripts/scheduler.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_EXPECTED_EMAIL: ${{ vars.CLOUDFLARE_EXPECTED_EMAIL }}
          CLOUDFLARE_FREE_PLAN_VERIFIED: ${{ vars.CLOUDFLARE_FREE_PLAN_VERIFIED }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
